            $ref: '#/definitions/models.ErrorResponseDoc'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "404":
          description: Flat not found
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "409":
