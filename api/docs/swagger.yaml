            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      security:
      - AccessToken: []
      summary: Submit flat claim
      tags:
      - Flat Claims
