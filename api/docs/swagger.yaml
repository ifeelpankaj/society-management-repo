  termsOfService: http://localhost:8000/terms
  title: Society Management API
  version: "1.0"
paths:
  /health:
    get:
      description: Checks if the API server is running.
      produces:
      - application/json
      responses:
        "200":
          description: API server is healthy
          schema:
            $ref: '#/definitions/models.HealthCheckResponseDoc'
      summary: Health check
      tags:
      - Health
  /health/live:
    get:
      description: Checks if the API process is alive.
      produces:
      - application/json
      responses:
        "200":
          description: API process is alive
          schema:
            $ref: '#/definitions/models.LivenessResponseDoc'
      summary: Liveness check
      tags:
      - Health
  /health/ready:
    get:
      description: Checks if the API server and database are ready.
      produces:
      - application/json
      responses:
        "200":
          description: API and database are ready
          schema:
            $ref: '#/definitions/models.ReadinessResponseDoc'
        "503":
          description: Database connection failed
          schema:
            $ref: '#/definitions/models.HealthErrorResponseDoc'
      summary: Readiness check
      tags:
      - Health
  /v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password after verifying the current
        password, then clears auth cookies.
      parameters:
      - description: Change password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/models.ChangePasswordAPIResponse'
        "400":
          description: Password mismatch, password reuse, or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      security:
      - AccessToken: []
      summary: Change password
      tags:
      - Auth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Always returns a generic success message. If the email exists,
        sends a password reset OTP.
      parameters:
      - description: Forgot password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset instructions response
          schema:
            $ref: '#/definitions/models.ForgotPasswordAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Request password reset OTP
      tags:
      - Auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a verified active user and sets access_token and
        refresh_token HTTP-only cookies.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/models.LoginAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "403":
          description: Email not verified or account disabled
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Login
      tags:
      - Auth
  /v1/auth/logout:
    post:
      description: Clears access_token and refresh_token cookies. This route is public
        and succeeds even if cookies are absent.
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/models.LogoutAPIResponse'
      summary: Logout
      tags:
      - Auth
  /v1/auth/profile:
    get:
      description: Returns the authenticated user's profile. Does not refresh or rotate
        tokens.
      produces:
      - application/json
      responses:
        "200":
          description: Profile fetched successfully
          schema:
            $ref: '#/definitions/models.GetProfileAPIResponse'
        "401":
          description: Missing, invalid, or expired access token
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      security:
      - AccessToken: []
      summary: Get current user profile
      tags:
      - Auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Validates the refresh token from either the refresh_token cookie
        or the request body.
      parameters:
      - description: Refresh token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RefreshTokenAPIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      security:
      - RefreshToken: []
      summary: Refresh access token
      tags:
      - Auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a user account and sends an email verification OTP.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created successfully
          schema:
            $ref: '#/definitions/models.RegisterAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "409":
          description: Email or phone already exists
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Register a new user
      tags:
      - Auth
  /v1/auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Sends a fresh email verification OTP for an unverified user.
      parameters:
      - description: Resend OTP payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent successfully
          schema:
            $ref: '#/definitions/models.ResendOTPAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "409":
          description: Email already verified
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Resend email verification OTP
      tags:
      - Auth
  /v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets a user's password using a valid password reset OTP and clears
        auth cookies on success.
      parameters:
      - description: Reset password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/models.ResetPasswordAPIResponse'
        "400":
          description: Invalid OTP, password reuse, or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "404":
          description: User or active OTP not found
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "429":
          description: Too many OTP attempts
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Reset password
      tags:
      - Auth
  /v1/auth/resident/register:
    post:
      consumes:
      - application/json
      description: Creates a resident user for the public flat claim flow, marks the
        email verified, and sets auth cookies immediately. This does not create a
        society membership or flat resident.
      parameters:
      - description: Resident registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ResidentRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Resident account created successfully
          schema:
            $ref: '#/definitions/models.LoginAPIResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "409":
          description: Email or phone already exists
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Register resident without OTP
      tags:
      - Auth
  /v1/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies the registration email OTP and marks the user's email
        as verified.
      parameters:
      - description: Email verification payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            $ref: '#/definitions/models.VerifyOTPAPIResponse'
        "400":
          description: Invalid OTP or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "404":
          description: User or OTP not found
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "429":
          description: Too many OTP attempts
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponseDoc'
      summary: Verify email OTP
      tags:
      - Auth
