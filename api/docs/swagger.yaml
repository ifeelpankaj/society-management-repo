      - description: Flat ID
        in: query
        name: flat_id
        type: integer
      - description: User ID
        in: query
        name: user_id
        type: integer
      - description: 'Claim status: pending, approved, rejected, cancelled'
        in: query
        name: status
        type: string
      - description: Search user, contact, flat, block, or status
        in: query
        name: search
        type: string
      - default: 20
        description: Limit
        in: query
